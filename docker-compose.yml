services:
  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    env_file: .env
    ports: ["8000:8000"]
  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile }
    environment: { NEXT_PUBLIC_API_URL: http://localhost:8000 }
    ports: ["3000:3000"]
    depends_on: [api]
