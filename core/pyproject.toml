[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-core"
version = "0.1.0"
description = "Framework-agnostic resilience-aware logistics planning algorithms"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[tool.setuptools.packages.find]
include = ["aegis_core*"]
