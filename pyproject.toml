[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "generate_full_report.py",
    "generate_academic_figures.py",
    "generate_documents.py",
    "build_review_document.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["core/tests", "services/api/tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aegis_core"]
